name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  native:
    name: Native solver (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/cielcraft-raphael
      - name: Build cielcraft-raphael
        run: cargo build --release --manifest-path native/cielcraft-raphael/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: raphael-native-windows
          path: native/cielcraft-raphael/target/release/cielcraft_raphael.dll
          if-no-files-found: error

  release:
    name: Package & publish
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: raphael-native-windows
          path: native/cielcraft-raphael/target/release/

      - name: Download Dalamud
        run: |
          curl -sL -o dalamud.zip https://goatcorp.github.io/dalamud-distrib/latest.zip
          unzip -qo dalamud.zip -d "$HOME/dalamud"
          echo "DALAMUD_HOME=$HOME/dalamud" >> "$GITHUB_ENV"

      - name: Build plugin
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          dotnet build CielCraft/CielCraft.csproj -c Release -p:Version="$VERSION.0"

      - name: Create release
        run: |
          cp CielCraft/bin/x64/Release/CielCraft/latest.zip CielCraft.zip
          gh release create "$GITHUB_REF_NAME" CielCraft.zip \
            --title "CielCraft $GITHUB_REF_NAME" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update repo.json on main
        run: |
          python3 - <<'EOF'
          import json, os, time

          manifest = json.load(open("CielCraft/bin/x64/Release/CielCraft/CielCraft.json"))
          tag = os.environ["GITHUB_REF_NAME"]
          url = f"https://github.com/${{ github.repository }}/releases/download/{tag}/CielCraft.zip"

          manifest.update({
              "AssemblyVersion": os.environ["VERSION"] + ".0",
              "DownloadLinkInstall": url,
              "DownloadLinkTesting": url,
              "DownloadLinkUpdate": url,
              "IsHide": False,
              "IsTestingExclusive": False,
              "LastUpdate": int(time.time()),
          })
          json.dump([manifest], open("repo.json", "w"), indent=2)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add repo.json
          git commit -m "Update repo.json for $GITHUB_REF_NAME" || echo "no changes"
          git push origin main
