name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        run: |
          curl -sL -o dalamud.zip https://goatcorp.github.io/dalamud-distrib/latest.zip
          unzip -qo dalamud.zip -d "$HOME/dalamud"
          echo "DALAMUD_HOME=$HOME/dalamud" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build CielCraft.Tests/CielCraft.Tests.csproj

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: CielCraft
          path: CielCraft/bin/x64/Release/CielCraft/
          if-no-files-found: error
