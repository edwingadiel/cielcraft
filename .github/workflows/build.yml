name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly build against the latest Dalamud distrib to catch API drift
    # from game patches before it bites in a play session.
    - cron: "0 6 * * 1"

jobs:
  native:
    name: Native solver (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/cielcraft-raphael

      - name: Build cielcraft-raphael
        run: cargo build --release --manifest-path native/cielcraft-raphael/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: raphael-native-windows
          path: native/cielcraft-raphael/target/release/cielcraft_raphael.dll
          if-no-files-found: error

  build:
    name: Plugin + tests
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/cielcraft-raphael

      - name: Build native solver for tests (Linux)
        run: cargo build --release --manifest-path native/cielcraft-raphael/Cargo.toml

      - name: Fetch Windows solver DLL
        uses: actions/download-artifact@v4
        with:
          name: raphael-native-windows
          path: native/cielcraft-raphael/target/release/

      - name: Download Dalamud
        run: |
          curl -sL -o dalamud.zip https://goatcorp.github.io/dalamud-distrib/latest.zip
          unzip -qo dalamud.zip -d "$HOME/dalamud"
          echo "DALAMUD_HOME=$HOME/dalamud" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build CielCraft.Tests/CielCraft.Tests.csproj

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: CielCraft
          path: CielCraft/bin/x64/Release/CielCraft/
          if-no-files-found: error
