# Vendored copy of raphael-solver from KonaeAkira/raphael-rs at commit
# def2860e5a2de4023fddc48e130f2d9b4b94710c (Apache-2.0, see LICENSE).
#
# Modification (see README.md): `MacroSolver::solve_from_state` — the upstream
# crate always starts a solve from the synthesis-begin state; CielCraft needs
# to solve the remainder of a craft from its live state (spec §17).
[package]
name = "raphael-solver"
edition = "2024"

[lib]
crate-type = ["rlib"]

[dependencies]
raphael-sim = { git = "https://github.com/KonaeAkira/raphael-rs", rev = "def2860e5a2de4023fddc48e130f2d9b4b94710c" }
rustc-hash = "2.1.1"
bitfield-struct = "0.12.1"
rayon = "1.11"
log = { version = "0.4", features = ["std"] }
serde = { version = "1.0", features = ["derive"], optional = true }
web-time = "1.1.0"
wide = "0.8.2"
nunny = "0.2.2"
strum = "0.27"
smallvec = { version = "1.15.1", features = ["const_generics", "union"] }
bump-scope = "2.2.0"

[features]
serde = ["dep:serde", "raphael-sim/serde"]

[dev-dependencies]
rand = "0.9.2"
env_logger = "0.11.8"
expect-test = "1.5.1"
test-case = "3.3.1"
